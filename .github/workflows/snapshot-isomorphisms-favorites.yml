name: Snapshot isomorphisms Archive favorites

on:
  push:
    branches:
      - ithon-rewrite
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Capture favorites collection surfaces
        run: sh tests_ithon/capture_favorites_sources.sh favorites-sources

      - name: Preserve favorites sources
        uses: actions/upload-artifact@v4
        with:
          name: isomorphisms-favorites-sources
          path: favorites-sources
