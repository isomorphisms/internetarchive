name: Ithon Archive URL tests

on:
  push:
    branches:
      - ithon-rewrite
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  archive-urls:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Internet Archive fork
        uses: actions/checkout@v4

      - name: Snapshot isomorphisms favorites
        run: sh tests_ithon/fetch_isomorphisms_favorites.sh isomorphisms-favorites.json

      - name: Preserve favorites snapshot
        uses: actions/upload-artifact@v4
        with:
          name: isomorphisms-archive-favorites
          path: isomorphisms-favorites.json

      - name: Check out Ithon
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/ithon
          path: _ithon

      - name: Build Ithon
        working-directory: _ithon
        run: |
          ./configure
          make -j2

      - name: Check URL fixtures
        run: ./_ithon/python tests_ithon/test_fixture_urls.pi

      - name: Capture independent browser responses
        run: sh tests_ithon/capture_browser_responses.sh browser-responses

      - name: Compare Ithon against curl
        env:
          ARCHIVE_SNAPSHOT_DIR: browser-responses
        run: ./_ithon/python tests_ithon/test_differential_archive.pi

      - name: Run HEAD range and filter tests
        run: ./_ithon/python tests_ithon/test_read_only_http.pi

      - name: Run live Archive integration tests
        run: ./_ithon/python tests_ithon/test_live_archive.pi

      - name: Preserve browser responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-browser-responses
          path: browser-responses
